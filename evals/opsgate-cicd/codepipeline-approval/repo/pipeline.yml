# Excerpt. PipelineRole, ArtifactBucket, BuildProject and ConnectionArn are defined elsewhere in this template.
Resources:
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: orders-api
      PipelineType: V2
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId: {Category: Source, Owner: AWS, Provider: CodeStarSourceConnection, Version: "1"}
              Configuration:
                ConnectionArn: !Ref ConnectionArn
                FullRepositoryId: acme/orders-api
                BranchName: main
              OutputArtifacts: [{Name: src}]
        - Name: Build
          Actions:
            - Name: Build
              ActionTypeId: {Category: Build, Owner: AWS, Provider: CodeBuild, Version: "1"}
              Configuration:
                ProjectName: !Ref BuildProject
              InputArtifacts: [{Name: src}]
              OutputArtifacts: [{Name: build}]
        - Name: DeployProd
          Actions:
            - Name: Deploy
              ActionTypeId: {Category: Deploy, Owner: AWS, Provider: ECS, Version: "1"}
              Configuration:
                ClusterName: prod
                ServiceName: orders-api
                FileName: imagedefinitions.json
              InputArtifacts: [{Name: build}]
