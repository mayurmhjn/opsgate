AWSTemplateFormatVersion: "2010-09-09"
Parameters:
  PrNumber:
    Type: String
Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      Tags:
        - Key: purpose
          Value: preview
        - Key: pr
          Value: !Ref PrNumber
  Api:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !Sub arn:aws:iam::${AWS::AccountId}:role/preview-lambda
      Code:
        ZipFile: "exports.handler = async () => ({ statusCode: 200, body: 'ok' });"
Outputs:
  SiteBucket:
    Value: !Ref SiteBucket
